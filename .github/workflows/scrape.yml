name: EDHREC Sync to Pinecone

on:
  schedule:
    # Semanal (lunes): modo incremental, solo agrega/actualiza sin borrar nada
    - cron: '0 3 * * 1'
    # Mensual (día 1): refresh completo, re-scrapea todo y poda Pinecone
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental = agrega (conserva archivos y Pinecone) | full = re-scrapea todo y poda Pinecone"
        type: choice
        options:
          - incremental
          - full
        required: false
        default: "incremental"
      max_pages_per_category:
        description: "Límite de páginas de Scryfall para pruebas (0 = sin límite)"
        required: false
        default: "0"
      pinecone_namespace:
        description: "Namespace de Pinecone"
        required: false
        default: "__default__"

concurrency:
  group: edhrec-sync-pinecone
  cancel-in-progress: false

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    # Margen holgado: el scrape normal tarda decenas de minutos, el presupuesto de abajo corta antes de este límite.
    timeout-minutes: 300
    env:
      # El cron mensual corre en modo full; cualquier otro schedule (semanal) es incremental
      SYNC_MODE: ${{ github.event.schedule == '0 3 1 * *' && 'full' || github.event.inputs.mode || 'incremental' }}
      SCRAPE_FORCE_REFRESH: ${{ (github.event.schedule == '0 3 1 * *' || github.event.inputs.mode == 'full') && 'true' || 'false' }}
      SCRAPE_MAX_PAGES_PER_CATEGORY: ${{ github.event.inputs.max_pages_per_category || '0' }}
      SCRAPE_CONCURRENCY: '5'
      SCRAPE_DELAY_MS: '400'
      SCRAPE_TIME_BUDGET_MINUTES: '200'
      PINECONE_FULL_REFRESH: ${{ (github.event.schedule == '0 3 1 * *' || github.event.inputs.mode == 'full') && 'true' || 'false' }}
      PINECONE_NAMESPACE: ${{ github.event.inputs.pinecone_namespace || '__default__' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show sync mode
        run: echo "Sync mode = $SYNC_MODE (force refresh = $SCRAPE_FORCE_REFRESH, pinecone prune = $PINECONE_FULL_REFRESH)"

      - name: Clean previous commander pages for full refresh
        if: env.SCRAPE_FORCE_REFRESH == 'true'
        run: rm -rf data/commanders

      - name: Scrape all commanders
        timeout-minutes: 20
        run: npm run scrape:all-commanders

      - name: Scrape commander pages
        timeout-minutes: 230
        run: npm run scrape:pages

      - name: Compile synergies
        timeout-minutes: 30
        run: npm run compile:synergies

      - name: Upload to Pinecone
        timeout-minutes: 40
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}
          PINECONE_NAMESPACE: ${{ env.PINECONE_NAMESPACE }}
          PINECONE_FULL_REFRESH: ${{ env.PINECONE_FULL_REFRESH }}
        run: npm run upload:pinecone

      # 🧹 Cleanup para no dejar archivos pesados en el workspace de GitHub
      - name: Cleanup data files
        run: |
          rm -f data/all-commanders.json
          rm -f data/commander-synergies.json
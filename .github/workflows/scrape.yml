name: EDHREC Sync to Pinecone

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Re-scrapear aunque ya existan archivos data/commanders/*.json"
        required: false
        default: "true"
      max_pages_per_category:
        description: "Límite de páginas de Scryfall para pruebas (0 = sin límite)"
        required: false
        default: "0"
      pinecone_full_refresh:
        description: "Borrar namespace antes de subir (evita datos stale)"
        required: false
        default: "true"
      pinecone_namespace:
        description: "Namespace de Pinecone"
        required: false
        default: "__default__"

concurrency:
  group: edhrec-sync-pinecone
  cancel-in-progress: false

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SCRAPE_FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'true' }}
      SCRAPE_MAX_PAGES_PER_CATEGORY: ${{ github.event.inputs.max_pages_per_category || '0' }}
      PINECONE_FULL_REFRESH: ${{ github.event.inputs.pinecone_full_refresh || 'true' }}
      PINECONE_NAMESPACE: ${{ github.event.inputs.pinecone_namespace || '__default__' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Clean previous commander pages for full refresh
        if: env.SCRAPE_FORCE_REFRESH == 'true'
        run: rm -rf data/commanders

      - name: Scrape all commanders
        run: npm run scrape:all-commanders

      - name: Scrape commander pages
        run: npm run scrape:pages

      - name: Compile synergies
        run: npm run compile:synergies

      - name: Upload to Pinecone
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}
          PINECONE_NAMESPACE: ${{ env.PINECONE_NAMESPACE }}
          PINECONE_FULL_REFRESH: ${{ env.PINECONE_FULL_REFRESH }}
        run: npm run upload:pinecone

      # 🧹 Cleanup para no dejar archivos pesados en el workspace de GitHub
      - name: Cleanup data files
        run: |
          rm -f data/all-commanders.json
          rm -f data/commander-synergies.json